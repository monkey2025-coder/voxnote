services:
  voxnote:
    build:
      context: .
      args:
        WHISPER_MODEL: base
    ports:
      - "8000:8000"
    environment:
      # !! 生产环境必须改成随机长字符串 !!
      # 生成: openssl rand -hex 32
      SECRET_KEY: "change-me-to-a-random-string"
      WHISPER_MODEL: base
    volumes:
      - voxnote-db:/code/db
      - voxnote-uploads:/code/uploads
      - voxnote-models:/code/models
    restart: unless-stopped

volumes:
  voxnote-db:
  voxnote-uploads:
  voxnote-models:
